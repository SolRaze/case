<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>THE LOUD PROJECT</title>
  <link rel="icon" href="loud.png">
  <link rel="apple-touch-icon" href="loud-180.png">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body data-view="boot">
  <div id="bg"></div>
  <canvas id="view" aria-hidden="true"></canvas>
  <canvas id="hi" aria-hidden="true"></canvas>
  <canvas id="ink" aria-hidden="true"></canvas>
  <section id="apparel">
    <ul id="tees"></ul>
    <figure id="tee">
      <img id="tee-photo" alt="">
      <figcaption><p id="tee-name"></p><p id="tee-kind"></p><p id="tee-note"></p><a id="tee-buy" target="_blank" rel="noopener"></a><ol id="tee-dots"></ol></figcaption>
    </figure>
  </section>
  <div id="ui">
    <header>
      <img class="px" src="loud.png" alt="">
      <div><p class="ink" id="brand"></p><p class="ink" id="sub"></p></div>
    </header>
    <div id="name" aria-live="polite"><p class="ink" id="n1"></p><p class="ink" id="n2"></p></div>
    <button id="inspo"><img class="px" alt=""><span class="ink"></span></button>
    <section id="detail">
      <p class="ink" id="d-maker"></p>
      <p class="ink" id="d-name"></p>
      <p class="ink" id="d-case"></p>
      <p class="ink" id="d-size"></p>
      <ul id="commands"></ul>
    </section>
    <ul id="parts"></ul>
    <section id="info">
      <p class="ink" id="i-name"></p>
      <dl id="i-list"></dl>
    </section>
    <p class="ink" id="loading" aria-live="polite"></p>
    <img class="px" id="up" alt="">
    <img class="px" id="down" alt="">
    <footer id="bar"></footer>
  </div>
  <div id="fade"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
