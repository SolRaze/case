<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>case</title>
  <link rel="icon" href="icon.svg">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body data-view="boot">
  <div id="bg"></div>
  <canvas id="view" aria-hidden="true"></canvas>
  <canvas id="hi" aria-hidden="true"></canvas>
  <canvas id="ink" aria-hidden="true"></canvas>
  <main id="ui">
    <header>
      <img class="px" src="icon.svg" alt="">
      <div><h1 class="ink" id="brand"></h1><p class="ink" id="sub"></p></div>
    </header>
    <div id="name" aria-live="polite"><p class="ink" id="n1"></p><p class="ink" id="n2"></p></div>
    <button id="inspo"><img class="px" alt=""><span class="ink"></span></button>
    <section id="detail">
      <p class="ink" id="d-maker"></p>
      <p class="ink" id="d-name"></p>
      <p class="ink" id="d-case"></p>
      <p class="ink" id="d-size"></p>
      <ul id="commands"></ul>
    </section>
    <ul id="parts"></ul>
    <section id="info">
      <p class="ink" id="i-name"></p>
      <dl id="i-list"></dl>
    </section>
    <p class="ink" id="loading" aria-live="polite"></p>
    <img class="px" id="up" alt="">
    <img class="px" id="down" alt="">
    <footer id="bar"></footer>
  </main>
  <div id="fade"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
